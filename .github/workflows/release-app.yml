name: Release desktop app

# Build mac (.app) + Windows (NSIS) in parallel, then ONE release job assembles
# the shared updater manifest and cuts the GitHub Release. Trigger: push an
# `app-v*` tag (kept separate from the CLI's `v*` tags).
#   git tag app-v0.1.9 && git push --tags
#
# Two distribution channels ship from the same release:
#   - first install: VoiceNote.zip (mac) / VoiceNote-setup.exe (win), fixed
#     names install-app.sh / install-app.ps1 fetch from releases/latest/download
#   - in-app update: latest.json + VoiceNote.app.tar.gz / VoiceNote-setup.exe,
#     consumed by the Tauri updater (see tauri.conf.json plugins.updater)
#
# Signing: the updater REQUIRES a minisign signature. Set repo secrets
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (from `tauri signer generate`); the public key lives in tauri.conf.json.

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Hard gate: a placeholder pubkey would ship an app whose updates verify-fail
  # on every user ("visible but un-installable"). Fail in seconds before any
  # 20-minute build runs, so a premature tag can't publish a broken release.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#app-v}" = "$(jq -r .version app/package.json)"
      - name: Reject placeholder updater pubkey
        run: |
          if grep -q REPLACE_WITH_PUBLIC_KEY app/src-tauri/tauri.conf.json; then
            echo "::error::updater pubkey is still a placeholder — run 'tauri signer generate', put plugins.updater.pubkey in tauri.conf.json and set the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets before tagging app-v*."
            exit 1
          fi

  build-macos:
    needs: preflight
    runs-on: macos-14 # Apple Silicon; builds a universal (x86_64+arm64) .app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      # pi can't be --compile'd (reads data files at runtime); staged intact.
      - name: Install pi (bundled into the app)
        run: npm i -g @earendil-works/pi-coding-agent

      # package.sh builds + deep-signs the .app, zips VoiceNote.zip (first
      # install), then (key present) repackages the signed .app into
      # VoiceNote.app.tar.gz + .sig for the updater.
      - name: Build + package
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun install
          bash scripts/package.sh

      - name: Name the stable install asset
        working-directory: app
        run: cp release/VoiceNote-*.zip release/VoiceNote.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: |
            app/release/VoiceNote.zip
            app/release/VoiceNote.app.tar.gz
            app/release/VoiceNote.app.tar.gz.sig

  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pi (bundled into the app)
        run: npm i -g @earendil-works/pi-coding-agent

      # createUpdaterArtifacts (main conf, merged in) + the signing key make the
      # NSIS build emit both -setup.exe and -setup.exe.sig. The exe doubles as
      # the updater artifact (reused, not a separate bundle).
      - name: Build (NSIS installer + updater sig)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun install
          bun run tauri build --config src-tauri/tauri.windows.conf.json

      - name: Collect installer + sig under stable names
        shell: pwsh
        run: |
          $dir = "app/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$dir/*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe) { throw "no NSIS setup.exe produced" }
          if (-not $sig) { throw "no updater .sig produced (signing key missing?)" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/VoiceNote-setup.exe
          Copy-Item $sig.FullName out/VoiceNote-setup.exe.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win
          path: |
            out/VoiceNote-setup.exe
            out/VoiceNote-setup.exe.sig

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist # -> dist/mac/*, dist/win/*

      # One manifest, both platforms — assembled here (not in the parallel build
      # jobs) so there's no read-modify-write race on the shared latest.json.
      # universal mac: both darwin arches point at the same .app.tar.gz.
      - name: Assemble latest.json
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#app-v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          jq -n \
            --arg ver "$VER" \
            --arg date "$(date -u +%FT%TZ)" \
            --arg macsig "$(cat dist/mac/VoiceNote.app.tar.gz.sig)" \
            --arg winsig "$(cat dist/win/VoiceNote-setup.exe.sig)" \
            --arg base "$BASE" \
            '{version:$ver, pub_date:$date, platforms:{
              "darwin-x86_64":  {signature:$macsig, url:($base+"/VoiceNote.app.tar.gz")},
              "darwin-aarch64": {signature:$macsig, url:($base+"/VoiceNote.app.tar.gz")},
              "windows-x86_64": {signature:$winsig, url:($base+"/VoiceNote-setup.exe")}
            }}' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/mac/VoiceNote.zip
            dist/mac/VoiceNote.app.tar.gz
            dist/win/VoiceNote-setup.exe
            latest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
