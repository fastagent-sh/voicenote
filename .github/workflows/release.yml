name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # OIDC for npm trusted publishing (token-free + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Explicit gates: robust against a skipped lifecycle (e.g. ignore-scripts),
      # which would otherwise let a bad tarball publish green. package.json's
      # `prepublishOnly` mirrors these for a manual local `npm publish`; keep the
      # two in sync when adding a gate.
      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test src/   # CLI tests only; app/ has its own CI

      # Smoke the published entry point (bin -> src/cli.ts): a bad shebang or a
      # runtime dep that's a devDep by mistake passes typecheck+test yet fails
      # to start. No build step — vn ships as source and runs on bun directly.
      - name: Smoke test CLI
        run: bun src/cli.ts --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, newer than what Node ships.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Token-free: OIDC (id-token: write) + a Trusted Publisher configured on
      # npmjs.com (repo kid7st/voicenote, workflow release.yml). Provenance is
      # generated automatically. NOTE: npm has no pending-publisher, so the FIRST
      # version must be published manually once before this workflow can take over.
      - name: Publish
        run: npm publish --ignore-scripts
