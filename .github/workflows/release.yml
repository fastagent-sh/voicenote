name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # OIDC for npm trusted publishing (token-free + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Explicit gates: robust against a skipped lifecycle (e.g. ignore-scripts),
      # which would otherwise let a bad tarball publish green. package.json's
      # `prepublishOnly` mirrors these for a manual local `npm publish`; keep the
      # two in sync when adding a gate.
      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test ./src   # the test runner is bun; the product runs on Node

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Node refuses to strip types under node_modules, so the package ships
      # compiled JavaScript. `npm publish --ignore-scripts` below skips
      # prepublishOnly, hence the explicit build.
      - name: Build
        run: bun run build

      # Smoke the published entry point (bin -> dist/cli.js) on the runtime
      # users get: a bad shebang, a devDep mistaken for a runtime dep, or a
      # missing build step passes typecheck+test yet fails to start.
      - name: Smoke test CLI
        run: node dist/cli.js --version

      # Trusted publishing needs npm >= 11.5.1, newer than what Node ships.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Token-free: OIDC (id-token: write) + a Trusted Publisher configured on
      # npmjs.com (repo fastagent-sh/voicenote, workflow release.yml). Provenance is
      # generated automatically. NOTE: npm has no pending-publisher, so the FIRST
      # version must be published manually once before this workflow can take over.
      - name: Publish
        run: npm publish --ignore-scripts
